<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OSM Authorization Callback</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101418;
      color: #eef2f6;
      font: 16px/1.5 system-ui, sans-serif;
    }
    main {
      width: min(720px, calc(100vw - 48px));
      padding: 28px;
      border-radius: 20px;
      background: #192028;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 28px;
    }
    code,
    textarea {
      width: 100%;
      box-sizing: border-box;
      border: 0;
      border-radius: 12px;
      background: #0d1116;
      color: #d6f0ff;
      padding: 14px;
      font: 14px/1.45 ui-monospace, monospace;
    }
    textarea {
      min-height: 160px;
      resize: vertical;
    }
    button {
      margin-top: 14px;
      padding: 10px 14px;
      border: 0;
      border-radius: 10px;
      background: #4fb7ff;
      color: #04131d;
      font-weight: 700;
      cursor: pointer;
    }
    p {
      margin: 14px 0 0;
    }
  </style>
</head>
<body>
  <main>
    <h1>OpenStreetMap authorization complete</h1>
    <p>Copy the full callback URL below and pass it to the CLI helper:</p>
    <code>python3 tmp-strava-to-way/osm_api_auth.py exchange '&lt;full callback url&gt;'</code>
    <textarea id="callback-url" readonly></textarea>
    <button id="copy-button" type="button">Copy callback URL</button>
  </main>
  <script>
    const callbackUrl = window.location.href;
    const field = document.getElementById("callback-url");
    field.value = callbackUrl;

    document.getElementById("copy-button").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(callbackUrl);
      } catch (_error) {
        field.focus();
        field.select();
      }
    });
  </script>
</body>
</html>
