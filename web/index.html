<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random bike routes</title>
  <link rel="stylesheet" href="./vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app-shell">
    <h1>Random bike routes</h1>
    <div class="app-shell-spacer" aria-hidden="true"></div>

    <div class="controls-grid">
      <div id="area-field" class="control-field">
        <select id="area-select" aria-label="Area"></select>
      </div>

      <div class="route-pair-row" aria-label="From and to route selectors">
        <div class="control-field">
          <select id="start-select" aria-label="From"></select>
        </div>
        <span class="route-direction-arrow" aria-hidden="true">→</span>
        <div class="control-field">
          <select id="end-select" aria-label="To"></select>
        </div>
      </div>
    </div>
    <div class="app-shell-spacer" aria-hidden="true"></div>

    <div class="route-panel">
      <div class="route-strip">
        <p class="scenario-title" id="scenario-label">Loading…</p>
      </div>

      <div class="map-view" id="map"></div>
      <div class="error-card hidden" id="error-card"></div>
    </div>
    <div class="app-shell-spacer" aria-hidden="true"></div>
    <div class="button-row">
      <button type="button" id="new-route-button"><span class="button-gradient-text">New route</span></button>
      <a class="download-link" id="download-link" href="#" aria-label="Download GPX" title="Download GPX">↓ GPX</a>
    </div>
    <div class="app-shell-spacer" aria-hidden="true"></div>
    <section class="bike-rental-links hidden" id="bike-rental-links" aria-labelledby="bike-rental-title">
      <p class="bike-rental-title" id="bike-rental-title">To rent bikes, contact</p>
      <div class="bike-rental-group">
        <p>Gate C (Kiambu road)</p>
        <a href="https://wa.me/254769362577">Fox bikes</a>
        <a href="https://wa.me/254103790513">Peter bikes</a>
        <a href="https://wa.me/254768221974">Umush</a>
      </div>
      <div class="bike-rental-group">
        <p>Gate D (ICRAF road)</p>
        <a href="https://wa.me/254798655738">Wilson</a>
        <a href="https://maps.app.goo.gl/cVJfSAxgWT6Gt93AA">Zuzu's</a>
      </div>
    </section>
    <div class="app-shell-spacer" aria-hidden="true"></div>
    <footer class="app-footer">
      <p class="note">
        <span class="note-line">Stats are approximate.</span>
        <span class="note-line">Thanks to <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> and <a href="https://www.opentopodata.org/datasets/mapzen/">Open Topo Data / Mapzen</a>.</span>
      </p>
    </footer>
  </main>

  <script src="./vendor/leaflet/leaflet.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
