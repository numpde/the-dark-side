<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contig editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link rel="stylesheet" href="./editor.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <h1>Contig editor</h1>
      <div class="topbar-actions">
        <button type="button" id="import-button">Import</button>
        <button type="button" id="export-button">Export patch file</button>
        <input id="import-input" type="file" accept="application/json,.json" hidden />
      </div>
    </header>

    <div class="layout">
      <div class="map-view" id="map"></div>

      <section class="panel">
        <div class="way-heading" id="way-heading">Select a contig</div>
        <div class="way-meta" id="way-meta"></div>

        <div class="field">
          <div class="field-label">State</div>
          <div class="button-strip">
            <button type="button" class="state-button" data-routing-state="default">Default</button>
            <button type="button" class="state-button" data-routing-state="include">Include</button>
            <button type="button" class="state-button" data-routing-state="exclude">Exclude</button>
          </div>
        </div>

        <label class="field">
          <span class="field-label">Bikeability</span>
          <select id="bikeability-select">
            <option value="">Default</option>
            <option value="1">1 · Easy</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5 · Hard</option>
          </select>
        </label>

        <label class="field">
          <span class="field-label">Direction</span>
          <select id="direction-select">
            <option value="both">Both</option>
            <option value="forward">1→2</option>
            <option value="backward">2→1</option>
          </select>
        </label>

        <label class="field">
          <span class="field-label">Unavailable until</span>
          <input id="unavailable-until-input" type="date" />
        </label>

        <div class="footer-row">
          <span id="change-count">0 changed</span>
          <button type="button" id="clear-button" class="secondary">Reset to default</button>
        </div>

        <div class="error hidden" id="error-box"></div>
      </section>
    </div>

    <section class="patch-info">
      <div class="patch-meta">
        <div><span class="field-label">Loaded patch file</span> <span id="loaded-patch-path">–</span></div>
        <div><span class="field-label">Export target</span> <span id="export-target-path">–</span></div>
        <div><span class="field-label">Editor graph</span> <span id="editor-graph-asset">–</span></div>
        <div><span class="field-label">Editor build</span> <span id="editor-generated-at">–</span></div>
        <div id="export-hint" class="patch-hint">Export downloads a replacement for the canonical patch file.</div>
      </div>
      <div class="patch-hint">Preview below shows the current export document: the loaded file plus any edits made on this page.</div>
      <pre id="patch-preview" class="patch-preview"></pre>
    </section>
  </main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script type="module">
    async function boot() {
      const response = await fetch("./generated/frontend-manifest.json", { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`Failed to load frontend manifest: ${response.status}`);
      }
      const manifest = await response.json();
      const version = manifest?.modules?.bootstrap_version;
      if (!version) {
        throw new Error("Frontend manifest is missing modules.bootstrap_version");
      }
      const { bootPageEntry, renderBootstrapFailure } = await import(`./entry-bootstrap.mjs?v=${encodeURIComponent(version)}`);
      await bootPageEntry({
        manifest,
        errorElementId: "error-box",
        failureLabel: "editor shell",
        bootstrapVersionKey: "bootstrap_version",
        entryVersionKey: "editor_version",
        entryPath: "./editor.js",
      });
    }

    boot().catch((error) => {
      console.error("Failed to load editor shell", error);
      const errorBox = document.getElementById("error-box");
      if (errorBox) {
        errorBox.textContent = `Failed to load editor shell: ${error.message || String(error)}`;
        errorBox.classList.remove("hidden");
      }
    });
  </script>
</body>
</html>
