name: Deploy Static App

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy-pages.yml"
      - ".dockerignore"
      - "Dockerfile"
      - "Makefile"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.mjs"
      - "scripts/**"
      - "source/**"
      - "tests/**"
      - "web/**"
      - "curated/karura_junctions.json"
      - "data/karura_map.json"
      - "data/karura_elevation.json"
      - "the_dark_side/**"

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/configure-pages@v6

      - name: Install contained dependencies
        run: ./scripts/dev-container.sh --install

      - name: Run contained checks and build Pages artifact
        run: ./scripts/dev-container.sh ci

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
