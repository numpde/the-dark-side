name: Deploy Static App

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - "curated/karura_junctions.json"
      - "data/karura_contigs.json"
      - "data/karura_elevation.json"
      - "the_dark_side/**"

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/configure-pages@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run frontend GPX tests
        run: |
          node --test tests/test_gpx.mjs
          node --check web/app.js

      - name: Export static route catalog
        run: |
          python3 -m the_dark_side.export_karura_web_catalog \
            --seed-start 1 \
            --seed-end 6 \
            --routes-per-scenario 12 \
            --selection-window 36

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
