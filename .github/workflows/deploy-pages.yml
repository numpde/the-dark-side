name: Deploy Static App

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy-pages.yml"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.mjs"
      - "scripts/**"
      - "source/**"
      - "tests/**"
      - "web/**"
      - "curated/karura_junctions.json"
      - "data/karura_map.json"
      - "data/karura_elevation.json"
      - "the_dark_side/**"

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/configure-pages@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run frontend JS checks
        run: |
          npm run check:web
          npm run test:web

      - name: Run Python asset tests
        run: |
          python3 -m unittest -v \
            tests.test_cli_entrypoints \
            tests.test_build_config \
            tests.test_export_catalog \
            tests.test_junction_bindings \
            tests.test_map_patches \
            tests.test_route_diversity \
            tests.test_web_assets

      - name: Build deploy artifact
        run: npm run build:web

      - name: Verify asset provenance
        run: |
          python3 -m the_dark_side.verify_editor_assets
          python3 -m the_dark_side.verify_app_assets
          python3 -m the_dark_side.verify_web_dist

      - name: Run Playwright smoke tests against dist
        run: npx playwright test

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
